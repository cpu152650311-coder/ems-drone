<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You | EMS Drone</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/design-tokens.css?v=16">
  <style>
    .thanks-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      background: var(--paper);
      padding: var(--space-5);
    }
    .thanks-page h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: var(--space-2);
    }
    .thanks-page p {
      color: var(--muted);
      max-width: 480px;
      margin: 0 auto var(--space-5);
      font-size: 1.08rem;
    }
    .thanks-page .check-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--signal);
      margin-bottom: var(--space-3);
    }
    .thanks-page .check-icon svg {
      width: 32px;
      height: 32px;
      color: #0b1408;
    }
  </style>
</head>
<body class="thanks-page">
  <main>
    <div class="check-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1>Brief received.</h1>
    <p>Thank you. An applications engineer will review your project and respond within 2–3 business days with a technical assessment.</p>
    <a href="/" class="btn btn-primary">Back to Home</a>
  </main>
</body>
</html>
